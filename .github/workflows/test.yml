name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: TypeScript (typecheck + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The orchestrator resolves @baro/memory through its built dist.
      - run: npm run build -w @baro/memory
      - run: npm run typecheck -w @baro/orchestrator -w baro-dsh -w @baro/memory
      - run: npm run test:fast -w @baro/orchestrator
      - run: npm test -w baro-dsh
      - run: npm test -w @baro/memory

  process:
    name: TypeScript (process ${{ matrix.shard }}/4)
    # These tests spawn CLIs and drive git worktrees; macOS is where they are
    # developed and known to pass.
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @baro/memory
      - name: Git identity for fixture repositories
        run: |
          git config --global user.name "Baro CI"
          git config --global user.email "ci@baro.invalid"
          git config --global init.defaultBranch main
      - run: npm run test:slow -w @baro/orchestrator -- --shard ${{ matrix.shard }}/4

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Process-ownership tests start a TypeScript fixture host through tsx.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --workspace
